<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A simple test website deployed using GitHub and Vercel."
  >

  <title>A Test Website</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      margin-bottom: 25px;

      border: 1px solid #334155;
      border-radius: 20px;

      color: #94a3b8;
      font-size: 14px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 72px);
      margin-bottom: 20px;
    }

    p {
      max-width: 600px;
      margin: 0 auto 35px;

      color: #cbd5e1;
      font-size: 20px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;

      padding: 14px 28px;

      background: #ffffff;
      color: #0f172a;

      border-radius: 8px;

      text-decoration: none;
      font-weight: bold;

      transition: 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    footer {
      margin-top: 70px;

      color: #64748b;
      font-size: 14px;
    }

    .status {
      margin-top: 25px;

      color: #22c55e;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="badge">
      GitHub + Vercel Test
    </div>

    <h1>Hello World 👋</h1>

    <p>
      This is a simple static HTML website hosted from GitHub
      and deployed using Vercel.
    </p>

    <a
      class="button"
      href="https://www.zaptech.com.au"
      target="_blank"
      rel="noopener noreferrer"
    >
      Visit Zaptech Australia
    </a>

    <div class="status">
      ● Website is online
    </div>

    <footer>
      © 2026 TFZA TRUST
    </footer>

  </main>

</body>
</html>
